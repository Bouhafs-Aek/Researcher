services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: researcher
      POSTGRES_USER: researcher
      POSTGRES_PASSWORD: researcher
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://researcher:researcher@db:5432/researcher
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  postgres_data:
